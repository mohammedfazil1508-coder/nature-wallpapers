{% extends 'base.html' %}
{% block title %}Login - Animated Nature Wallpapers{% endblock %}
{% block content %}
<section class="section" style="max-width: 500px;">
    <h1 class="section-title">Login</h1>
    <div class="card" style="padding: 2rem;">
        <form action="/login" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem;">Don't have an account? <a href="/register" style="color: var(--accent-color);">Register</a></p>
    </div>
</section>
{% endblock %}
