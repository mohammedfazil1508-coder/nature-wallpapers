{% extends 'admin/admin_base.html' %}
{% block title %}Admin Login - Animated Nature Wallpapers{% endblock %}
{% block content %}
<section class="section" style="max-width: 500px;">
    <h1 class="section-title">Admin Login</h1>
    <div class="card" style="padding: 2rem; border-top: 5px solid var(--accent-color);">
        <form action="/admin/login" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Admin Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login as Admin</button>
        </form>
    </div>
</section>
{% endblock %}
