{% extends 'base.html' %}
{% block title %}{{ pack.name }} - Animated Nature Wallpapers{% endblock %}
{% block content %}
<section class="section">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem;">
        <div>
            <div style="border-radius: var(--radius); overflow: hidden; box-shadow: var(--card-shadow);">
                <img src="{{ url_for('static', filename='images/demo.jpg') }}" alt="{{ pack.name }}" style="width: 100%; display: block;">
            </div>
        </div>
        <div>
            <div class="card-category">Wallpaper Pack</div>
            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">{{ pack.name }}</h1>
            <p style="font-size: 1.5rem; font-weight: bold; color: var(--accent-color); margin-bottom: 1.5rem;">₹{{ pack.price }}</p>
            
            <p style="color: #555; margin-bottom: 2rem; line-height: 1.8;">
                {{ pack.description }}
            </p>
            
            <ul style="list-style: none; margin-bottom: 2rem; color: #666;">
                <li style="margin-bottom: 0.5rem;"><i class="fas fa-images"></i> <strong>Contains:</strong> {{ pack.num_wallpapers }} Wallpapers</li>
            </ul>
            
            <div style="display: flex; gap: 1rem;">
                <button class="btn" style="flex: 1; padding: 1rem;" onclick="addToCart({{ pack.id }}, 'pack', {{ pack.price }}, '{{ pack.name }}'); location.href='/cart';">Buy Pack Now</button>
                <button class="btn btn-outline" style="flex: 1; padding: 1rem; color: var(--text-color); border-color: var(--border-color);" onclick="addToCart({{ pack.id }}, 'pack', {{ pack.price }}, '{{ pack.name }}')"><i class="fas fa-cart-plus"></i> Add to Cart</button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
