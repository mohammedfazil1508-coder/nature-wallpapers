{% extends 'base.html' %}
{% block title %}Register - Animated Nature Wallpapers{% endblock %}
{% block content %}
<section class="section" style="max-width: 500px;">
    <h1 class="section-title">Register</h1>
    <div class="card" style="padding: 2rem;">
        <form action="/register" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Full Name</label>
                <input type="text" name="name" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px;">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem;">Already have an account? <a href="/login" style="color: var(--accent-color);">Login</a></p>
    </div>
</section>
{% endblock %}
